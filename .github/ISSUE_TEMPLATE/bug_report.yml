name: Bug report
description: Report a crash, incorrect behaviour, or unexpected output
labels: [bug, needs-repro]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps that trigger the bug. Include the sign/verify call and any options you passed.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Paste any error or thrown value (use a code block).
      render: text
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime were you on? This library targets Web Crypto, so the runtime matters.
      options:
        - Node.js
        - Deno
        - Bun
        - Cloudflare Workers / workerd
        - Other edge runtime
        - Browser
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: "e.g. output of `node -v`, `deno --version`, or `bun --version`"
      placeholder: "v24.14.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: "Which version of webhook-hmac-kit? Check your package.json or lockfile."
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter (if any)
      description: "Express, Fastify, NestJS, or none if you call sign/verify directly."
      placeholder: none
    validations:
      required: false
