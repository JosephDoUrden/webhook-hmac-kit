# Publish from a GitHub release using npm provenance and OIDC trusted publishing.
#
# One-time setup required on npmjs.com:
# 1. Settings → Publishing access → Trusted publisher: GitHub Actions
# 2. Configure: owner = JosephDoUrden, repo = webhook-hmac-kit, workflow = release.yml
# 3. Verify npm CLI on runner is ≥11.5.1 (Node 24 ships npm 10.x, must upgrade; see runner setup step)
#
# npm trusted publishing via OIDC: https://docs.npmjs.com/trusted-publishers (accessed 05 Sep 2026)
# Requires: npm ≥11.5.1, Node ≥22.14.0. GitHub-hosted runners only (self-hosted not yet supported).
# Provenance is automatic; set NPM_CONFIG_PROVENANCE=false to disable if needed.

name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm 10.x ships with Node 24; upgrade to npm 11 for OIDC support (11.5.1+ required)
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11

      - name: Verify versions
        run: |
          echo "npm version: $(npm --version)"
          echo "Node version: $(node --version)"

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

      - name: Check version matches tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            # Tag format: v2.0.0 → version 2.0.0
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Tag '$TAG' does not match semantic version pattern vX.Y.Z"
              exit 1
            fi
            EXPECTED_VERSION="${TAG#v}"
            ACTUAL_VERSION=$(node -p "require('./package.json').version")
            if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "Error: package.json version ($ACTUAL_VERSION) does not match tag version ($EXPECTED_VERSION)"
              exit 1
            fi
            echo "Version verified: $ACTUAL_VERSION"
          else
            # workflow_dispatch: just print the version
            echo "Package version: $(node -p "require('./package.json').version")"
          fi

      - name: Attach npm pack preview to job summary
        if: always()
        run: |
          {
            echo "## Package Preview"
            echo "Files that would be published:"
            echo "\`\`\`"
            npm pack --dry-run 2>&1 | tail -n +2
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Publish to npm (dry-run on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --provenance

      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
