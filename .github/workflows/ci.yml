name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the oldest supported line (20 went end-of-life on 30 Apr 2026); 24 is Active LTS
        # until 20 Oct 2026. Add 26 when it becomes LTS on 28 Oct 2026.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

  # The Node matrix above cannot say anything about the runtimes this library was ported to Web
  # Crypto for. This job runs the built package on all three, through one plain script - vitest only
  # runs on Node, and @cloudflare/vitest-plugin (the successor to vitest-pool-workers) needs
  # vitest >= 4.1 while this repo is on 2, so workerd waits for its own upgrade commit.
  edge-smoke:
    name: Smoke on Node, Deno and Bun
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # SHA pins are for the third-party actions; the GitHub-owned ones above ride their major tags
      # by choice.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: npm ci
      - run: npm run build

      - run: node test/smoke/smoke.mjs
      - run: deno run test/smoke/smoke.mjs
      - run: bun test/smoke/smoke.mjs

  # One stable check name for the branch ruleset to require. Matrix legs rename themselves when the
  # matrix changes and a skipped leg leaves a PR waiting forever, so the ruleset points at this job
  # only. It fails unless every job above succeeded.
  gate:
    name: gate
    if: always()
    needs: [test, edge-smoke]
    runs-on: ubuntu-latest
    env:
      TEST: ${{ needs.test.result }}
      EDGE_SMOKE: ${{ needs.edge-smoke.result }}
    steps:
      - run: |
          echo "test=$TEST edge-smoke=$EDGE_SMOKE"
          test "$TEST" = success
          test "$EDGE_SMOKE" = success
